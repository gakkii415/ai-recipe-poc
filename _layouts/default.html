<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3efe5">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="KITCHEN INDEX ホーム">
        <span class="brand-mark" aria-hidden="true">KI</span>
        <span>KITCHEN INDEX</span>
      </a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="{{ '/' | relative_url }}#recipes">レシピ</a>
        <a href="{{ '/POSTING_GUIDE/' | relative_url }}">投稿仕様</a>
        <a href="{{ '/api/recipes.json' | relative_url }}">JSON API</a>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <p>AI大量投稿の技術検証用サイト。掲載内容は公開前のレビューを前提としています。</p>
      <p>{{ site.version }} · <a href="https://github.com/gakkii415/ai-recipe-poc">GitHub Repository ↗</a></p>
    </footer>
  </body>
</html>
