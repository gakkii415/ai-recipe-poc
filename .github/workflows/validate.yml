name: Validate recipe platform

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate recipe content
        run: ruby scripts/validate_posts.rb
      - name: Type-check and build 94 static pages
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build
