name: Validate and build recipe site

on:
  push:
    paths:
      - "_posts/**"
      - "scripts/validate_posts.rb"
      - "_config.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "_posts/**"
      - "scripts/validate_posts.rb"
      - "_config.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate front matter and recipe structure
        run: ruby scripts/validate_posts.rb
      - name: Build GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
