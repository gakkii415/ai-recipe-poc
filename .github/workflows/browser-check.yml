name: Recipe browser check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the actual static site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks and screenshots
        run: node tests/recipe-browser.mjs
      - name: Attach current source for evidence review
        if: always()
        run: |
          mkdir -p evidence
          tar -czf evidence/source.tar.gz src tests DESIGN.md FEATURES.md CONTENT.md package.json astro.config.*
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-browser-evidence
          path: evidence/
          retention-days: 7
